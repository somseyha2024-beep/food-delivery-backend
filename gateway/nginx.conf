map $http_upgrade $connection_upgrade { default upgrade; '' close; }

server {
  listen 80;

  location /auth/        { proxy_pass http://auth-service:8080; }
  location /restaurants  { proxy_pass http://order-service:8080; }
  location /orders       { proxy_pass http://order-service:8080; }
  location /payments     { proxy_pass http://payment-service:8080; }
  location /drivers      { proxy_pass http://location-service:8080; }
  location /ws/ {
    proxy_pass http://location-service:8080;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 3600s;
  }
  # /internal/* is intentionally NOT routed => unreachable from outside.
}
