name: CI
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [auth-service, order-service, payment-service, location-service]
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
      - name: Analyze
        working-directory: services/${{ matrix.service }}
        run: dart pub get && dart analyze
      - name: Docker build
        run: docker build -f docker/Dockerfile --build-arg SERVICE=${{ matrix.service }} -t ${{ matrix.service }}:ci .
  # Deploy: push images to GHCR, then deploy to Render / Cloud Run / ECS
  # and point MONGO_URI at MongoDB Atlas.
